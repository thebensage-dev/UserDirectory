# Weekly update PRs, at most a few a week: minor and patch updates arrive together in one PR per
# ecosystem, and only majors come on their own.
# @thebensage-dev packages come from GitHub Packages: package-lock.json names that registry for
# them. Dependabot signs in there by itself with its GITHUB_TOKEN, which may read them because each
# package's Manage Actions access lists this repo (Package settings), so no token is configured
# here. The registry is declared only so Dependabot may reach it.
version: 2
registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
updates:
  - package-ecosystem: npm
    directory: /
    registries: [github-packages]
    schedule:
      interval: weekly
    # Skip releases younger than 3 days (most bad releases are pulled by then).
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    ignore:
      # Deliberate pins, the same in all three Node repos: typescript-eslint supports only
      # TypeScript < 6.1, and eslint-config-next's plugins only ESLint 9. Lift when that changes.
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # Node's types follow .nvmrc (Node 26 LTS); move them with the next LTS.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      next:
        patterns: ["next", "eslint-config-next"]
      minor-and-patch:
        update-types: [minor, patch]

  # The FROM lines in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Node 26 is the LTS; odd majors are never LTS. Move with .nvmrc, by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
